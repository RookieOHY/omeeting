<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Record Flow — Demo</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090905;color:#eee9df}body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.stage{position:relative;isolation:isolate;width:100%;height:100svh;min-height:590px;overflow:hidden;background:#0d0c07}.stage:before{content:"";position:absolute;z-index:-1;inset:0;opacity:.17;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E")}.copy{position:absolute;z-index:5;top:10%;left:11%;width:240px}.eyebrow{color:#827c70;font-size:9px;letter-spacing:.2em;margin:0 0 34px}.copy h1{font:600 clamp(24px,2.4vw,32px)/1.1 system-ui,sans-serif;letter-spacing:-.04em;margin:0 0 8px}.artist{color:#a9a293;font:16px Georgia,serif;margin:0}.rule{height:1px;background:#e8e0d23d;margin:24px 0 18px}dl{margin:0;display:grid;gap:9px;font-size:11px}dl div{display:grid;grid-template-columns:86px 1fr}dt{color:#898477}dd{color:#ddd6c8;margin:0}.artboard{position:absolute;inset:0;overflow:hidden}.line{position:absolute;width:150%;height:1px;left:-18%;top:67%;transform:rotate(-12deg);background:#e8e0d21f}.record{--size:clamp(112px,17vw,230px);position:absolute;z-index:calc(10 - var(--depth));left:48%;top:42%;width:var(--size);aspect-ratio:1;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;transform:translate(calc(var(--offset)*clamp(78px,17vw,245px) - 50%),calc(var(--offset)*-8vw - 50%));transition:transform .85s cubic-bezier(.2,.8,.2,1),width .7s,filter .7s;filter:brightness(calc(1 - var(--depth)*.12))}.record.active{--size:clamp(230px,31vw,460px);z-index:12}.cover{position:absolute;inset:0;overflow:hidden;display:block;border-radius:50%;border:2px solid #f0e9d9b8;box-shadow:0 20px 52px #0008,inset 0 0 0 1px #ffffff33}.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 18%,#ffffff5c,transparent 38%),linear-gradient(135deg,transparent 45%,#1e1a1429)}.amber .cover{background:linear-gradient(145deg,#7c6542,#d6ba86 50%,#473a2a)}.violet .cover{background:repeating-linear-gradient(145deg,#30263e 0 22px,#69547e 24px 55px,#392e4b 60px 86px)}.arch .cover{background:linear-gradient(140deg,#cdbb9c,#eee4d1 55%,#998972)}.blueprint .cover{background-color:#e5e3db;background-image:linear-gradient(#2c323126 1px,transparent 1px),linear-gradient(90deg,#2c323126 1px,transparent 1px),repeating-linear-gradient(35deg,transparent 0 24px,#2d32322e 25px 27px);background-size:22px 22px,22px 22px,auto}.blue .cover{background:linear-gradient(110deg,#23374d,#7389a1 52%,#30475f)}.gold .cover{background:radial-gradient(circle,#c7ae7d,#ead9b4 60%,#8d7449)}.cream .cover{background:radial-gradient(circle at 60% 40%,#d7c7aa,#b8a88e)}.rust .cover{background:repeating-conic-gradient(#60452e 0 15deg,#bd8050 17deg 34deg,#423629 36deg 53deg)}.sketch{position:absolute;inset:7%;width:86%;height:86%;transform:rotate(-4deg);fill:none;stroke:#45413a;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.label{position:absolute;z-index:2;left:50%;top:50%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#faf9f4 0 19%,#d8d6cf 20% 23%,#f2f0e8 24% 69%,#d1cfc8 70% 73%,#f8f6ef 74%);box-shadow:0 2px 9px #0004;color:#96938b;font-size:clamp(5px,.65vw,9px);letter-spacing:.09em}.label small{font-size:.65em;opacity:.6}.hole{position:absolute;z-index:3;left:50%;top:50%;width:8%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#080805;box-shadow:0 0 0 2px #ddd9cf}.controls{position:absolute;z-index:20;right:11%;bottom:13%;display:flex;align-items:center;gap:14px}.count{margin-right:4px;color:#b7b0a2;font-size:13px;letter-spacing:.12em}.count i{font-style:normal;color:#716b5f;padding:0 5px}.arrow{width:46px;height:46px;display:grid;place-items:center;color:#e8e0d2;border:1px solid #e8e0d24d;background:transparent;border-radius:50%;cursor:pointer;transition:background .2s,transform .2s}.arrow:hover{background:#e8e0d21f;transform:scale(1.06)}.arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);color:#7e786c;font-size:9px;letter-spacing:.15em;white-space:nowrap}
    @media(max-width:700px){.stage{min-height:620px}.copy{top:28px;left:24px;width:calc(100% - 48px)}.eyebrow{margin-bottom:12px}.copy h1{font-size:24px}.artist{font-size:14px}.rule{width:180px;margin:12px 0 10px}dl{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:9px}dl div{display:flex;gap:5px}.artboard{top:130px;height:370px}.line{top:75%}.record{left:43%;top:58%;--size:clamp(110px,34vw,165px);transform:translate(calc(var(--offset)*22vw - 50%),calc(var(--offset)*-11vw - 50%))}.record.active{--size:clamp(205px,58vw,280px)}.controls{right:24px;bottom:52px;gap:8px}.arrow{width:42px;height:42px}.count{font-size:12px}.hint{bottom:16px;font-size:8px}}@media(prefers-reduced-motion:reduce){.record,.arrow{transition:none}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy" aria-live="polite">
      <p class="eyebrow">O-MEETING · LISTENING ROOM</p><h1 id="title">Arc Sketches</h1><p class="artist" id="artist">Mirela Ost</p><div class="rule"></div>
      <dl><div><dt>Cat. no.</dt><dd id="catalog">LO–027</dd></div><div><dt>Released</dt><dd id="year">2026</dd></div><div><dt>Format</dt><dd id="format">CD, 7-inch</dd></div><div><dt>Runtime</dt><dd id="runtime">24:40</dd></div></dl>
    </section>
    <div class="artboard" id="artboard"><div class="line"></div></div>
    <nav class="controls" aria-label="唱片轮播控制"><span class="count" id="count">03 <i>/</i> 08</span><button class="arrow" id="prev" aria-label="上一张"><svg viewBox="0 0 24 24"><path d="M19 12H5m7 7-7-7 7-7"/></svg></button><button class="arrow" id="next" aria-label="下一张"><svg viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></button></nav>
    <p class="hint">CLICK A RECORD OR USE THE ARROWS TO EXPLORE</p>
  </main>
  <script>
    const records=[
      {title:'Soft Focus',artist:'Mira Sol',catalog:'LO–024',year:'2024',format:'12-inch',runtime:'31:08',art:'amber'},
      {title:'Afterimage',artist:'Nami Kato',catalog:'LO–026',year:'2025',format:'7-inch',runtime:'18:42',art:'violet'},
      {title:'Arc Sketches',artist:'Mirela Ost',catalog:'LO–027',year:'2026',format:'CD, 7-inch',runtime:'24:40',art:'arch'},
      {title:'Room Tone',artist:'Studio April',catalog:'LO–028',year:'2026',format:'12-inch',runtime:'27:16',art:'blueprint'},
      {title:'Blue Hour',artist:'Noah Fields',catalog:'LO–029',year:'2026',format:'7-inch',runtime:'21:03',art:'blue'},
      {title:'Still Life',artist:'Ari Venn',catalog:'LO–030',year:'2026',format:'CD',runtime:'19:57',art:'gold'},
      {title:'Quiet Forms',artist:'Mirela Ost',catalog:'LO–031',year:'2026',format:'12-inch',runtime:'29:12',art:'cream'},
      {title:'Low Orbit',artist:'Mira Sol',catalog:'LO–032',year:'2026',format:'7-inch',runtime:'22:36',art:'rust'}
    ];
    let active=2;const board=document.querySelector('#artboard');
    records.forEach((r,i)=>{const b=document.createElement('button');b.className=`record ${r.art}`;b.setAttribute('aria-label',`${r.title} — ${r.artist}`);b.innerHTML=`<span class="cover">${r.art==='arch'?'<svg class="sketch" viewBox="0 0 320 320"><path d="M70 238 82 112l78-42 78 42 12 126M58 238h204M77 124h166M89 108l71-38 71 38M96 126v103m23-103v103m27-103v103m29-103v103m27-103v103m23-103v103M70 238l20-12h140l20 12M81 112l79-42 79 42"/><path d="M93 108h134M96 119h128M76 130h168M83 137h154M89 231h142M66 246h188"/><path d="M160 70v168M82 112l-8 126m164-126 8 126M111 102l-7 136m112-136 7 136" stroke="#8f8474" stroke-width="1"/></svg>':''}<span class="label"><b>${r.catalog}</b><small>${r.title}</small></span><i class="hole"></i></span>`;b.addEventListener('click',()=>{active=i;render()});board.append(b)});
    function render(){[...board.querySelectorAll('.record')].forEach((el,i)=>{let o=i-active;if(o>records.length/2)o-=records.length;if(o< -records.length/2)o+=records.length;el.style.setProperty('--offset',o);el.style.setProperty('--depth',Math.abs(o));el.classList.toggle('active',i===active)});const r=records[active];for(const k of ['title','artist','catalog','year','format','runtime'])document.getElementById(k).textContent=r[k];document.querySelector('#count').innerHTML=`${String(active+1).padStart(2,'0')} <i>/</i> ${String(records.length).padStart(2,'0')}`}
    function step(n){active=(active+n+records.length)%records.length;render()}document.querySelector('#prev').addEventListener('click',()=>step(-1));document.querySelector('#next').addEventListener('click',()=>step(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});render();
  </script>
</body>
</html>
